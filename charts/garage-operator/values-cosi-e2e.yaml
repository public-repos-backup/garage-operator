# COSI E2E test values - extends e2e values with COSI enabled
image:
  repository: garage-operator
  tag: cosi-e2e
  pullPolicy: Never

leaderElection:
  enabled: true

# Disable security contexts for Kind cluster compatibility
podSecurityContext: {}
securityContext: {}

# No resource limits for tests
resources: {}

# Exercise namespace-scoped manager/cache/RBAC behavior. The chart also adds
# the release namespace automatically, so Garage and shadow resources remain
# managed while ordinary COSI claims are accepted only from default.
watchNamespaces:
  - default

# Enable COSI driver
cosi:
  enabled: true
  driverName: garage.rajsingh.info
