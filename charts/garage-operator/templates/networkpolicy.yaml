{{- if and .Values.networkPolicy.enabled (or .Values.metrics.enabled .Values.webhooks.enabled) -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "garage-operator.fullname" . }}-allow-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garage-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "garage-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  {{- if .Values.metrics.enabled }}
  - from:
    - namespaceSelector:
        {{- toYaml .Values.networkPolicy.allowedNamespaceSelector | nindent 8 }}
    ports:
    - port: {{ include "garage-operator.metricsPort" . }}
      protocol: TCP
  {{- end }}
  {{- if .Values.webhooks.enabled }}
  # Admission and conversion requests originate from the API server. Its
  # source labels/namespace are not portable across Kubernetes distributions.
  - ports:
    - port: 9443
      protocol: TCP
  {{- end }}
{{- end }}
