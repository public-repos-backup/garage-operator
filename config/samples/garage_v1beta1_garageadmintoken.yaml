---
# Static Admin bootstrap material. The GarageCluster named below must explicitly
# set spec.admin.adminTokenSecretRef.name: garage-admin-bootstrap and must be in
# this namespace. The CR does not create a dynamic Garage token row; deleting it
# does not revoke a token already loaded by a running Garage process.
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageAdminToken
metadata:
  name: admin-bootstrap
  namespace: garage-operator-system
spec:
  clusterRef:
    name: garage
  neverExpires: true
  secretTemplate:
    name: garage-admin-bootstrap
    tokenKey: admin-token
    includeEndpoint: true
