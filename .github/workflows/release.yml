name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      # Provenance attestation for the install.yaml release asset.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Verify Helm chart version matches tag
        run: make helm-verify-version

      - name: Generate install manifests
        run: |
          make build-installer IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}

      - name: Attest install manifest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/install.yaml

      - name: Select curated release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${{ steps.version.outputs.VERSION }}.md"
          if [[ ! -s "$notes" ]]; then
            echo "::error::missing curated release notes at $notes"
            exit 1
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            dist/install.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
