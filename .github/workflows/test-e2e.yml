name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_NODE_IMAGE: kindest/node:v1.35.0

jobs:
  e2e-ginkgo:
    name: Ginkgo E2E Tests (${{ matrix.shard.name }})
    runs-on: ${{ matrix.shard.runner }}
    # Keep each safety-coordinated API block in its own cluster. Manual drains
    # and dual-version topology changes intentionally wait through Garage's
    # production proof windows, while each management-handle block starts a
    # real Garage. Isolation preserves cleanup/debug margin under this cap.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The Ginkgo suite is split into 6 primary shards by Ginkgo label so
        # each runs on its own Kind cluster in parallel.
        # The "layout" shard is a catch-all complement so any spec not explicitly
        # claimed by a dedicated shard (including future unlabeled Describes) still
        # runs exactly once — no coverage is silently dropped. The six primary
        # filters are disjoint and exhaustive over the suite's labels.
        # core-arm64 re-runs the core shard on GitHub's free arm64 runners —
        # the operator ships multi-arch images (docker.yml) but nothing
        # exercised them; arch-specific breakage surfaced only on user
        # clusters (arm64 SBCs are a common Garage substrate).
        shard:
          - name: core
            runner: ubuntu-latest
            filter: "gateway || manager || webhooks || external-gateway"
            kind_config: ""
          - name: api-dual-version
            runner: ubuntu-latest
            filter: "dual-version"
            kind_config: ""
          - name: api-manual-mode
            runner: ubuntu-latest
            filter: "manual-mode"
            kind_config: ""
          - name: api-management-handle
            runner: ubuntu-latest
            filter: "management-handle"
            kind_config: ""
          # factor-migration is split out of the catch-all because it is a
          # destructive whole-cluster purge with its own multi-minute barriers.
          # Together with the drain in auto-mode-pernode (a single ~13m spec,
          # bounded by Garage's BLOCK_GC_DELAY) it pushed the catch-all past the
          # 40m Go timeout on a loaded runner.
          - name: factor-migration
            runner: ubuntu-latest
            filter: "factor-migration"
            kind_config: ""
          - name: layout
            runner: ubuntu-latest
            filter: "!(gateway || manager || webhooks || external-gateway || dual-version || manual-mode || management-handle || node-local-pools || factor-migration)"
            kind_config: ""
          - name: node-local-pools
            runner: ubuntu-latest
            filter: "node-local-pools"
            kind_config: "test/e2e/kind-node-local-pools.yaml"
          - name: core-arm64
            runner: ubuntu-24.04-arm
            filter: "gateway || manager || webhooks || external-gateway"
            kind_config: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.31.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      - name: Run Ginkgo e2e tests
        run: make test-e2e GINKGO_LABEL_FILTER='${{ matrix.shard.filter }}' KIND_CLUSTER='garage-e2e-${{ matrix.shard.name }}' KIND_CONFIG_E2E='${{ matrix.shard.kind_config }}'

      - name: Collect debug info
        if: failure()
        run: |
          mkdir -p /tmp/e2e-debug
          kind get clusters > /tmp/e2e-debug/clusters.txt 2>&1 || true
          for cluster in $(kind get clusters 2>/dev/null); do
            kubectl --context "kind-$cluster" get all -A > "/tmp/e2e-debug/${cluster}-resources.txt" 2>&1 || true
            kubectl --context "kind-$cluster" logs deployment/garage-operator-controller-manager -n garage-operator-system --tail=200 > "/tmp/e2e-debug/${cluster}-operator.txt" 2>&1 || true
          done

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ginkgo-e2e-logs-${{ matrix.shard.name }}
          path: /tmp/e2e-debug/
          retention-days: 7

  # Aggregator gate: branch protection requires a status check named exactly
  # "Ginkgo E2E Tests". The sharded matrix above produces per-shard checks
  # ("Ginkgo E2E Tests (core)", ...), so this single job preserves the required
  # check name and passes only when every shard succeeded.
  e2e-ginkgo-result:
    name: Ginkgo E2E Tests
    runs-on: ubuntu-latest
    needs: [e2e-ginkgo]
    if: always()
    steps:
      - name: Verify all Ginkgo shards passed
        run: |
          result='${{ needs.e2e-ginkgo.result }}'
          echo "Aggregate shard result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::One or more Ginkgo E2E shards did not succeed ($result)"
            exit 1
          fi
          echo "All Ginkgo E2E shards passed."

  e2e-cluster:
    name: Single-Cluster E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.31.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Run single-cluster e2e tests
        run: make test-e2e-cluster

      # The script's trap dumps operator logs + resources to /tmp/e2e-debug
      # before tearing down kind, so the upload below captures real state. If
      # the script crashes before its trap fires, this artifact will be empty.
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cluster-e2e-logs
          path: /tmp/e2e-debug/
          retention-days: 7
          if-no-files-found: warn


  e2e-cosi:
    name: COSI E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.31.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Run COSI e2e tests
        run: make test-e2e-cosi

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cosi-e2e-logs
          path: /tmp/e2e-debug/
          retention-days: 7
          if-no-files-found: warn

  e2e-multicluster:
    name: Multi-Cluster E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
