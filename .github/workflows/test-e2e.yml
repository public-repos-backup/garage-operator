          install_only: true
          version: v0.31.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Run multi-cluster e2e tests
        run: make test-e2e-multicluster

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: multicluster-e2e-logs
          path: /tmp/e2e-debug/
          retention-days: 7
          if-no-files-found: warn

  e2e-external-gateway:
    name: External Gateway E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.31.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Run external gateway e2e tests
        run: make test-e2e-external-gateway

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: external-gateway-e2e-logs
          path: /tmp/e2e-debug/
          retention-days: 7
          if-no-files-found: warn

  e2e-ipv6:
    name: IPv6 Dual-Stack E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
